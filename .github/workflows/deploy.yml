name: Deploy Parking Management System to Single EC2

# Trigger the workflow on push to main branch or manually via the Actions tab
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================================
  # STAGE 1: CI (Continuous Integration - Test & Build Check)
  # ==========================================================
  ci-build-check:
    name: 🧪 CI - Build & Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 1: Validate Frontend Build
      - name: 📦 Install Frontend Dependencies & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # Step 2: Validate Backend Dependencies
      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: |
          npm ci || npm install --omit=dev

  # ==========================================================
  # STAGE 2: CD (Continuous Deployment to Single EC2)
  # ==========================================================
  deploy-to-ec2:
    name: 🚀 CD - Deploy to AWS EC2
    needs: ci-build-check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository for deployment files
        uses: actions/checkout@v4

      - name: 🔐 Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME || 'admin' }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD || 'secretpassword123' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: false
          envs: MONGO_USERNAME,MONGO_PASSWORD,GH_TOKEN
          script: |
            echo "================================================="
            echo "🚀 Starting Deployment on EC2 Instance"
            echo "================================================="

            APP_DIR="parking-management-system"

            # 1. Start Docker service
            sudo systemctl start docker

            # 2. Clone or Pull the latest code
            if [ -d "$APP_DIR" ]; then
              echo "📁 Repository exists. Pulling latest code..."
              cd "$APP_DIR"
              git fetch --all
              git reset --hard origin/main || git reset --hard origin/master
            else
              echo "📁 Repository not found. Cloning repository..."
              git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$APP_DIR"
              cd "$APP_DIR"
            fi

            # 3. Generate .env file securely from GitHub Secrets
            echo "🔐 Generating .env file from GitHub Secrets..."
            cat <<EOF > .env
            MONGO_USERNAME=${MONGO_USERNAME}
            MONGO_PASSWORD=${MONGO_PASSWORD}
            PORT=5000
            EOF

            # 4. Build and launch containers using Docker Compose
            echo "🐳 Rebuilding and starting Docker containers..."
            sudo docker compose down --remove-orphans
            sudo docker compose up -d --build

            # 5. Clean up dangling images to save EC2 disk space
            echo "🧹 Cleaning up unused Docker images..."
            sudo docker image prune -f

            # 6. Check container status
            echo "📊 Current Running Containers:"
            sudo docker compose ps

            echo "================================================="
            echo "✅ Deployment Successful!"
            echo "🌐 Only Frontend (Port 80) is exposed."
            echo "🔒 Backend (Port 5000) & MongoDB (Port 27017) are private."
            echo "================================================="
